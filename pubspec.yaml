name: punto_de_venta
description: Frontend de BarroControl conectado a la API de punto de venta.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  flutter_image_compress: ^2.5.0
  file_selector: ^1.1.0
  app_badge_plus: 1.3.5
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
