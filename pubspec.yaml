name: punto_de_venta
description: Frontend de BarroControl conectado a la API de punto de venta.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  flutter_image_compress: ^2.5.0
  file_selector: ^1.1.0
  app_badge_plus: 1.3.5
  permission_handler: 12.0.1
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.5.0
  image: ^4.12.0
  flutter_secure_storage: ^11.2.0
  dropdown_search: ^8.1.0
  material_ui: ^1.11.0
  uuid: ^4.6.0
  print_bluetooth_thermal: ^1.2.5
  file_saver: ^0.7.0
  intl: ^0.20.3
  toastification: 3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
